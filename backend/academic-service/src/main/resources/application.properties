# Puerto de este microservicio
server.port=8081

# Nombre de la aplicación
spring.application.name=academic-service

# Configuración de H2 Database
spring.datasource.url=jdbc:h2:mem:academicdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=password

# Configuración de JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Habilitar la consola web de H2 para ver los datos en el navegador
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
